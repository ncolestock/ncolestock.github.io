name: restore-build-speaking
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore-speaking/**"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit build_speaking.py
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root = Path(".restore-speaking")
          man = json.loads((root/"MANIFEST.json").read_text())
          parts = [root/f"build_speaking.b64.{i:02d}" for i in range(man["parts"])]
          for p in parts:
              assert p.exists(), p
          b64 = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == man["sha256"], (digest, man["sha256"])
          path = Path(man["path"])
          path.write_bytes(data)
          text = data.decode("utf-8")
          assert "python3" in text.splitlines()[0]
          assert "PLACEHOLDER" not in text
          print("restored", path, len(data), digest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_speaking.py
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Speaking: restore build_speaking.py from staged parts"
            git push
          fi
