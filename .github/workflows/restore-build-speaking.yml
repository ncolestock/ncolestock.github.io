name: restore-build-speaking
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore-speaking/TRIGGER"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore build_speaking.py from 51ab7c73 and add talk-header.css
        run: |
          set -euo pipefail
          git show 51ab7c73668426f0b2871757de0084c3e267f242:scripts/build_speaking.py > scripts/build_speaking.py
          python3 <<'PY'
          from pathlib import Path
          p = Path("scripts/build_speaking.py")
          t = p.read_text()
          assert t.startswith("#!/usr/bin/env python3"), t[:40]
          assert "PLACEHOLDER" not in t
          needle = '<link rel="stylesheet" href="/style.css">'
          add = '<link rel="stylesheet" href="/speaking/talk-header.css">'
          if add not in t:
            if needle not in t:
              raise SystemExit("style.css link missing")
            t = t.replace(needle, needle + "\n" + add, 1)
            p.write_text(t)
          print("ok", p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_speaking.py
          if git diff --cached --quiet; then echo no-change; else
            git commit -m "Speaking: restore build_speaking.py from 51ab7c73 + talk-header.css"
            git push
          fi
